[project]
name = "portfolio-delivery"
version = "0.2.0"
description = "Lean portfolio delivery with modern Dagger"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "dagger-io",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "poethepoet>=0.37,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.13,<1",
  "xenon>=0.9.3,<1",
]

[tool.uv.sources]
dagger-io = { path = ".dagger/sdk", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".dagger/sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_any_explicit = true
exclude = '^\.dagger/sdk/'

[tool.pytest.ini_options]
markers = ["integration: exercises the real Dagger CLI and engine"]
testpaths = ["tests"]

[tool.poe.tasks]
lock-check = "uv lock --check"
typecheck = "mypy --strict .dagger/src tests"
complexity = "xenon --max-absolute A --max-modules A --max-average A .dagger/src"
test-unit = "pytest -m 'not integration'"
test = "pytest"
audit = "pip-audit"

[tool.poe.tasks.lint]
shell = "ruff check --fix . && ruff format ."

[tool.poe.tasks.lint-check]
shell = "ruff check . && ruff format --check ."
