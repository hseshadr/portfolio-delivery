[project]
name = "portfolio-delivery"
version = "0.1.0"
description = "Deterministic, policy-gated software delivery envelopes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harish Seshadri", email = "harish.seshadri@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[project.urls]
Homepage = "https://github.com/hseshadr/portfolio-delivery"
Repository = "https://github.com/hseshadr/portfolio-delivery"
Issues = "https://github.com/hseshadr/portfolio-delivery/issues"

[build-system]
requires = ["uv_build==0.8.24"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "cyclonedx-python-lib[json-validation]==11.12.0",
  "dagger-io",
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<2",
  "mutmut>=3.3,<4",
  "packaging==26.3",
  "pip-audit>=2.9,<3",
  "poethepoet>=0.37,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "xenon>=0.9.3,<1",
]

[tool.uv.sources]
dagger-io = { path = ".dagger/sdk", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".dagger/sdk", "tests/dagger/live_fixture"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/dagger/test_module_api.py" = ["S603"]
"tests/dagger/test_oras_service.py" = ["S603"]
"tests/dagger/test_secret_boundary.py" = ["S603"]
".dagger/src/portfolio_delivery_dagger/dto.py" = ["RUF009"]
".dagger/src/portfolio_delivery_dagger/oras.py" = ["RUF009"]
"tests/dagger/plan_fixture/src/task_8_plan_fixture/main.py" = ["RUF009"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_any_explicit = true
exclude = '^(\.dagger/sdk/|tests/dagger/(live_fixture|plan_fixture)/)'

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", ".dagger/src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [".dagger/sdk/*"]

[tool.mutmut]
source_paths = ["src/portfolio_delivery"]
only_mutate = [
  "src/portfolio_delivery/domain/*.py",
  "src/portfolio_delivery/envelope/*.py",
  "src/portfolio_delivery/adapters/oras.py",
  "src/portfolio_delivery/contracts/oci.py",
]
also_copy = ["pyproject.toml", "scripts"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/", "tests/conformance/"]
on_dependency_change = "rerun"

[tool.poe.tasks]
lock-check = "uv lock --check"
typecheck = "mypy --strict src tests .dagger/src"
complexity = "xenon --max-absolute A --max-modules A --max-average A src .dagger/src"
test-unit = "pytest tests/unit"
test-property = "pytest tests/property"
test-conformance = "pytest tests/conformance"
test-dagger = "pytest tests/dagger"
test = "pytest --cov=src/portfolio_delivery --cov-branch --cov-report=term-missing --cov-fail-under=90"
demo-local-oci = "python scripts/local-oci-demo.py"
benchmark-oci-limits = "python scripts/benchmark-oci-limits.py"
audit = "pip-audit"

[tool.poe.tasks.lint]
shell = "ruff check --fix . && ruff format ."

[tool.poe.tasks.mutation]
shell = """
mutmut run &&
mutmut export-cicd-stats &&
cp mutants/mutmut-cicd-stats.json mutmut-cicd-stats.json &&
python scripts/check-mutation-stats.py mutmut-cicd-stats.json
"""
